name: NeuroQuiz 171 Android emulator QA
# QA-only branch: never merge, never touch main. Runs the synthetic acceptance suite on CI emulators.
on:
  push:
    branches: [qa/android171-emulator]
permissions:
  contents: read
concurrency:
  group: android171-emulator
  cancel-in-progress: false
jobs:
  emulator:
    if: github.repository == 'drmgfarag-cmd/Neuroquiz' || github.repository == 'drmgfarag-cmd/neuroquiz'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 33
            profile: pixel_6
          - api: 30
            profile: pixel_c
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run acceptance suite
        uses: reactivecircus/android-emulator-runner@v2.32.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash qa/run171.sh
