# Builds the NeuroQuiz installers. Run it from the Actions tab
# ("Run workflow"); download the APK / Windows installer from the run's artifacts.
name: NeuroQuiz apps

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: Books included in the downloadable apps
        type: choice
        required: true
        default: full
        options: [full, empty]
  pull_request:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env: { LIBRARY_BUNDLE: "${{ inputs.bundle == 'empty' && 'none' || 'full' }}" }
      - uses: actions/upload-artifact@v4
        with: { name: "neuroquiz-web-${{ inputs.bundle == 'empty' && 'empty' || 'full' }}", path: dist }

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
        env: { LIBRARY_BUNDLE: "${{ inputs.bundle == 'empty' && 'none' || 'full' }}" }
      - run: npx cap add android && npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: "neuroquiz-android-apk-${{ inputs.bundle == 'empty' && 'empty' || 'full' }}", path: android/app/build/outputs/apk/debug/*.apk }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - run: npm run build
        env: { LIBRARY_BUNDLE: "${{ inputs.bundle == 'empty' && 'none' || 'full' }}" }
      - run: npm install
        working-directory: desktop
      - run: npm run dist:win
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with: { name: "neuroquiz-windows-${{ inputs.bundle == 'empty' && 'empty' || 'full' }}", path: "desktop/dist/*.exe" }
