# LOCAL PREPARATION ONLY. Publication of the exact compiled runtime and generic
# QA files requires the owner's explicit approval. No PR, cache or artifact action.
name: NeuroQuiz exact Windows180 runtime QA
on:
  push:
    branches: [qa/windows180-runtime-046c359f]
permissions:
  contents: read
concurrency:
  group: windows180-exact-runtime
  cancel-in-progress: false
jobs:
  installed-windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa/windows180-runtime-046c359f'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TRANSFER_MANIFEST_SHA256: 130507af25c96e0099efc33d17460cade87d6c97201a95e70f2c2480ccd1e97c
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NPM_CONFIG_FETCH_TIMEOUT: '60000'
      NPM_CONFIG_FETCH_RETRIES: '0'
    steps:
      - name: Fetch current commit inputs and verify every byte
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY.ToLowerInvariant() -ne 'drmgfarag-cmd/neuroquiz'){throw 'Exact approved repository required'}
          if($env:GITHUB_SHA -notmatch '^[a-f0-9]{40}$'){throw 'Exact commit required'}
          if($env:TRANSFER_MANIFEST_SHA256 -notmatch '^[a-f0-9]{64}$'){throw 'Transfer manifest is not bound'}
          $root=Join-Path $env:RUNNER_TEMP 'NQ161-Exact'
          if(Test-Path -LiteralPath $root){throw 'Fresh input root required'}
          New-Item -ItemType Directory -Path $root | Out-Null
          function Fetch([string]$relative,[string]$destination){
            if($relative -notmatch '^qa/[A-Za-z0-9._/-]+$' -or $relative.Contains('..')){throw 'Unsafe remote input path'}
            $url='https://raw.githubusercontent.com/'+$env:GITHUB_REPOSITORY+'/'+$env:GITHUB_SHA+'/'+$relative
            & curl.exe --silent --show-error --fail --location --connect-timeout 15 --max-time 120 --retry 1 --output $destination $url
            if($LASTEXITCODE -ne 0){throw ('Raw input unavailable: '+$relative)}
          }
          function Verify([string]$file,$pin){
            if($pin.sha256 -notmatch '^[a-f0-9]{64}$' -or (Get-Item -LiteralPath $file).Length -ne $pin.bytes -or (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256){throw ('Input identity differs: '+$file)}
          }
          $manifest=Join-Path $root 'Transfer_Inputs161.json'
          Fetch 'qa/Transfer_Inputs161.json' $manifest
          if((Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:TRANSFER_MANIFEST_SHA256){throw 'Transfer manifest SHA differs'}
          $m=Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if($m.format -ne 'neuroquiz-public-exact-transfer161-v1' -or $m.installer.parts.Count -ne 40){throw 'Exact transfer schema and40 parts required'}
          if($m.installer.bytes -ne 166493115 -or $m.installer.sha256 -ne '046c359f0cbe2c5e5808a23853cc8c039f46785b6c8925017431dd1c6e683a97'){throw 'Exact163 installer required'}
          if($m.runner.path -ne 'qa/Runner161.zip' -or $m.runner.bytes -ne 114215 -or $m.runner.sha256 -ne 'f6fc4fe11302d14d2bc7c5a28f9366a44c74b88a07be177274cb7cf972ac1858'){throw 'Exact161 runner ZIP required'}
          $installer=Join-Path $root 'NeuroQuiz-180-Windows-x64-Setup-Unsigned.exe'
          $stream=[IO.File]::Open($installer,[IO.FileMode]::CreateNew)
          try{
            for($index=0;$index -lt 40;$index++){
              $pin=$m.installer.parts[$index];$expected='qa/installer.part-'+$index.ToString('000')
              if($pin.path -ne $expected -or $pin.bytes -gt 4194304 -or $pin.bytes -lt 1){throw 'Part order or fixed4MiB bound differs'}
              $part=Join-Path $root ('part-'+$index.ToString('000'))
              Fetch $pin.path $part; Verify $part $pin
              $bytes=[IO.File]::ReadAllBytes($part);$stream.Write($bytes,0,$bytes.Length)
              Remove-Item -LiteralPath $part
            }
          }finally{$stream.Dispose()}
          Verify $installer $m.installer
          $zip=Join-Path $root 'Runner161.zip';Fetch $m.runner.path $zip;Verify $zip $m.runner
          if($m.helpers.Count -ne 1 -or $m.helpers[0].path -ne 'qa/Run_Exact_Windows161.cjs'){throw 'Exact generic wrapper required'}
          $wrapper=Join-Path $root 'Run_Exact_Windows161.cjs';Fetch $m.helpers[0].path $wrapper;Verify $wrapper $m.helpers[0]
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $root 'Runner')
          "NQ161_ROOT=$root" >> $env:GITHUB_ENV
      - name: Parse PowerShell and install only locked acceptance dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $node=(Get-Command node.exe -ErrorAction Stop).Source
          & $node -e "if(Number(process.versions.node.split('.')[0])<20)throw Error('Node20+ required')"
          if($LASTEXITCODE -ne 0){throw 'Usable Node missing; no app installed'}
          Set-Location (Join-Path $env:NQ161_ROOT 'Runner')
          foreach($script in Get-ChildItem -LiteralPath . -Filter *.ps1 -Recurse){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($script.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ($script.Name+': '+($errors.Message -join '; '))}
          }
          & npm.cmd ci --ignore-scripts --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'Locked dependency installation failed'}
          & $node --test tests\runner-contract.test.cjs tests\sync-peer-contract.test.cjs
          if($LASTEXITCODE -ne 0){throw 'Harness contract checks failed'}
      - name: Run fresh current installed Windows UI and stream retained evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # Windows PowerShell 5.1 children must not inherit PowerShell 7 module paths,
          # otherwise built-in cmdlets such as Get-FileHash fail to load.
          $env:PSModulePath=[Environment]::GetEnvironmentVariable('PSModulePath','Machine')
          & node.exe (Join-Path $env:NQ161_ROOT 'Run_Exact_Windows161.cjs') --runner (Join-Path $env:NQ161_ROOT 'Runner') --installer (Join-Path $env:NQ161_ROOT 'NeuroQuiz-180-Windows-x64-Setup-Unsigned.exe') --output (Join-Path $env:NQ161_ROOT 'Results')
          exit $LASTEXITCODE
  # 180: upgrade check. Installs the exact 179 release (fetched from its own pinned QA commit), then the current
  # release over it, and checks the result: exact payload files only (no leftovers), no stage/backup folders,
  # the registration version, and the Start-menu AppUserModelID needed for Windows reminder notifications.
  # 177 (audit-176 packages F5): before the upgrade a QA-only copy of the 179 exe seeds learner data (a profile and a
  # finished five-question test, Upgrade_Learner_Data180.cjs); after it the 180 QA copy must find the same session row
  # and every learner table at least as full. The release NeuroQuiz.exe itself is then started with
  # --remote-debugging-port / --inspect and must refuse (exit 1, port closed).
  upgrade-windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa/windows180-runtime-046c359f'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PREV_COMMIT: 2d6336cb7025d5fa2587014bb307d46f1b5f238d
      PREV_MANIFEST_SHA256: 25c8b2d1bb83c512df016e747fb93292eb248bc9b84ff6cfdab971ace4a12a46
      PREV_INSTALLER_SHA256: b5180b7eadb40679d35295916c63b83e489bd2921c1c32d5645f6499c751f7c4
      SEED_SHA256: 056e64a254f1c6bb557aecf2fd34155a4fd76b41940e06f143692106e8298b37
      NEW_MANIFEST_SHA256: 130507af25c96e0099efc33d17460cade87d6c97201a95e70f2c2480ccd1e97c
      NEW_INSTALLER_SHA256: 046c359f0cbe2c5e5808a23853cc8c039f46785b6c8925017431dd1c6e683a97
    steps:
      - name: Install previous release, upgrade to current, verify
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY.ToLowerInvariant() -ne 'drmgfarag-cmd/neuroquiz'){throw 'Exact approved repository required'}
          $root=Join-Path $env:RUNNER_TEMP 'NQ-Upgrade'; New-Item -ItemType Directory -Path $root | Out-Null
          function Fetch([string]$commit,[string]$relative,[string]$destination){
            if($relative -notmatch '^qa/[A-Za-z0-9._/-]+$' -or $relative.Contains('..')){throw 'Unsafe remote input path'}
            $url='https://raw.githubusercontent.com/'+$env:GITHUB_REPOSITORY+'/'+$commit+'/'+$relative
            & curl.exe --silent --show-error --fail --location --connect-timeout 15 --max-time 120 --retry 1 --output $destination $url
            if($LASTEXITCODE -ne 0){throw ('Raw input unavailable: '+$relative)}
          }
          function Sha([string]$f){(Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash.ToLowerInvariant()}
          function Assemble([string]$commit,[string]$manifestSha,[string]$installerSha,[string]$name){
            $mf=Join-Path $root ($name+'.json'); Fetch $commit 'qa/Transfer_Inputs161.json' $mf
            if((Sha $mf) -ne $manifestSha){throw ($name+': transfer manifest SHA differs')}
            $m=Get-Content -LiteralPath $mf -Raw | ConvertFrom-Json
            if($m.installer.sha256 -ne $installerSha){throw ($name+': installer pin differs')}
            $exe=Join-Path $root ($name+'.exe'); $s=[IO.File]::Open($exe,[IO.FileMode]::CreateNew)
            try{ for($i=0;$i -lt $m.installer.parts.Count;$i++){ $pin=$m.installer.parts[$i]; $p=Join-Path $root 'part'
                Fetch $commit $pin.path $p; if((Sha $p) -ne $pin.sha256){throw 'Part SHA differs'}
                $b=[IO.File]::ReadAllBytes($p); $s.Write($b,0,$b.Length); Remove-Item -LiteralPath $p } } finally { $s.Dispose() }
            if((Sha $exe) -ne $installerSha){throw ($name+': installer SHA differs')}
            return @{exe=$exe; manifest=$m}
          }
          $prev=Assemble $env:PREV_COMMIT $env:PREV_MANIFEST_SHA256 $env:PREV_INSTALLER_SHA256 'previous'
          $cur=Assemble $env:GITHUB_SHA $env:NEW_MANIFEST_SHA256 $env:NEW_INSTALLER_SHA256 'current'
          $zip=Join-Path $root 'Runner.zip'; Fetch $env:GITHUB_SHA $cur.manifest.runner.path $zip
          if((Sha $zip) -ne $cur.manifest.runner.sha256){throw 'Runner SHA differs'}
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $root 'Runner')
          $runnerDir=Join-Path $root 'Runner'; Push-Location $runnerDir
          & npm.cmd ci --ignore-scripts --no-audit --no-fund; $npm=$LASTEXITCODE; Pop-Location
          if($npm -ne 0){throw 'Runner dependencies could not be installed'}
          $seed=Join-Path $root 'Upgrade_Learner_Data180.cjs'; Fetch $env:GITHUB_SHA 'qa/Upgrade_Learner_Data180.cjs' $seed
          if((Sha $seed) -ne $env:SEED_SHA256){throw 'Learner-data helper SHA differs'}
          $state=Join-Path $root 'learner-state.json'
          $target=Get-Content -LiteralPath (Join-Path $root 'Runner\Windows_Target161.json') -Raw | ConvertFrom-Json
          $dir=Join-Path $env:LOCALAPPDATA 'Programs\NeuroQuiz'; $key='HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\org.neuroquiz.desktop'
          $results=[ordered]@{}
          function Check([string]$name,[bool]$ok,[string]$detail){ $results[$name]=[ordered]@{pass=$ok;detail=$detail}; Write-Output ("{0} {1}: {2}" -f ($(if($ok){'PASS'}else{'FAIL'})),$name,$detail) }
          $p=Start-Process -FilePath $prev.exe -ArgumentList '/S' -PassThru -Wait
          Check 'previous-install' ($p.ExitCode -eq 0 -and (Test-Path (Join-Path $dir 'NeuroQuiz.exe'))) ("exit "+$p.ExitCode)
          # 177 (packages F5): seed learner data with the previous release (QA copy, removed again by the helper).
          & node.exe $seed seed --runner $runnerDir --install $dir --state $state 2>&1 | ForEach-Object { Write-Output ("seed "+$_) }
          $seeded=$LASTEXITCODE
          Check 'seed-learner-data' ($seeded -eq 0 -and (Test-Path -LiteralPath $state) -and -not (Test-Path -LiteralPath (Join-Path $dir 'NeuroQuiz-QA.exe'))) ("exit "+$seeded)
          for($i=0;$i -lt 30 -and @(Get-Process -Name NeuroQuiz,NeuroQuiz-QA -ErrorAction SilentlyContinue).Count;$i++){ Start-Sleep -Seconds 1 }
          $before=@(Get-ChildItem -LiteralPath $dir -Recurse -File).Count
          $prevVersion=(Get-ItemProperty -LiteralPath $key).DisplayVersion
          # The installer refuses to upgrade while NeuroQuiz.exe is open (it takes a write handle first). Right after an
          # install, antivirus scanning can hold the new exe briefly; wait until a write handle is available.
          $exePath=Join-Path $dir 'NeuroQuiz.exe'; $free=$false
          for($i=0;$i -lt 60 -and -not $free;$i++){ try{ $h=[IO.File]::Open($exePath,'Open','Write','Delete'); $h.Dispose(); $free=$true } catch { Start-Sleep -Seconds 2 } }
          Write-Output ("exe writable before upgrade: "+$free+" after "+$i+" tries; running: "+(@(Get-Process -Name NeuroQuiz -ErrorAction SilentlyContinue).Count))
          Write-Output ("registry AppId: "+(Get-ItemProperty -LiteralPath $key).AppId+"; owner marker: "+((Get-Content -LiteralPath (Join-Path $dir '.neuroquiz-owner') -Raw) -replace "`r`n",'<CRLF>'))
          # Record how far the installer gets (stage/backup folders, registry version, exe handle) while it runs.
          $watch=Start-Job -ArgumentList $dir,$key -ScriptBlock { param($d,$k) $seen=@{}; $t0=Get-Date
            while(((Get-Date)-$t0).TotalSeconds -lt 120){ $s=@(); foreach($x in @($d,"$d.__stage","$d.__previous")){ if(Test-Path -LiteralPath $x){ $s+=(Split-Path $x -Leaf)+'='+@(Get-ChildItem -LiteralPath $x -Recurse -File -ErrorAction SilentlyContinue).Count } }
              $s+='reg='+(Get-ItemProperty -LiteralPath $k -ErrorAction SilentlyContinue).DisplayVersion; $line=$s -join ' '; if(-not $seen.ContainsKey($line)){ $seen[$line]=1; "{0:N1}s {1}" -f ((Get-Date)-$t0).TotalSeconds,$line }; Start-Sleep -Milliseconds 100 } }
          $p=Start-Process -FilePath $cur.exe -ArgumentList '/S' -PassThru -Wait
          $first=$p.ExitCode
          Start-Sleep -Seconds 2; Stop-Job $watch; Receive-Job $watch | Select-Object -First 40 | ForEach-Object { Write-Output ("trace "+$_) }
          if($first -ne 0){ Start-Sleep -Seconds 30; $p=Start-Process -FilePath $cur.exe -ArgumentList '/S' -PassThru -Wait }
          Check 'upgrade-exit' ($p.ExitCode -eq 0) ("exit "+$p.ExitCode+" (first attempt "+$first+"); previous files "+$before+"; previous version "+$prevVersion)
          $expected=@{}; foreach($r in $target.installedPayloads){ $expected[$r.path.Replace('/','\').ToLowerInvariant()]=$r }
          $extra=@(); $wrong=@(); $seen=@{}
          foreach($f in Get-ChildItem -LiteralPath $dir -Recurse -File){
            $rel=$f.FullName.Substring($dir.Length+1).ToLowerInvariant()
            if($rel -eq 'uninstall neuroquiz.exe' -or $rel -eq '.neuroquiz-owner'){continue}
            if(-not $expected.ContainsKey($rel)){$extra+=$rel;continue}
            $seen[$rel]=1; $pin=$expected[$rel]
            if($f.Length -ne $pin.bytes -or (Sha $f.FullName) -ne $pin.sha256){$wrong+=$rel}
          }
          $missing=@($expected.Keys | Where-Object { -not $seen.ContainsKey($_) })
          Check 'payload-exact' ($extra.Count -eq 0 -and $wrong.Count -eq 0 -and $missing.Count -eq 0) ("expected "+$expected.Count+"; extra "+$extra.Count+" "+(($extra|Select-Object -First 5) -join ',')+"; changed "+$wrong.Count+"; missing "+$missing.Count)
          $left=@(Get-ChildItem -LiteralPath (Split-Path $dir) -Directory -Filter 'NeuroQuiz.__*' -ErrorAction SilentlyContinue | ForEach-Object Name)
          Check 'no-stage-or-backup' ($left.Count -eq 0) ($left -join ',')
          $ver=(Get-ItemProperty -LiteralPath $key).DisplayVersion
          Check 'registration-version' ($ver -like ('*'+$target.release+'*')) $ver
          # 178 (audit-177 W03, packages F4): the installed program file carries NeuroQuiz's own name and version, not Electron's.
          $vi=(Get-Item -LiteralPath (Join-Path $dir 'NeuroQuiz.exe')).VersionInfo
          Check 'exe-identity' ($vi.ProductName -eq 'NeuroQuiz' -and $vi.FileDescription -eq 'NeuroQuiz' -and $vi.ProductVersion -like ('1.0.'+$target.release+'*')) ($vi.ProductName+' | '+$vi.FileDescription+' | '+$vi.ProductVersion+' | '+$vi.CompanyName)
          # 180: the Start menu list is rebuilt asynchronously after an upgrade (177 run saw it at once; 179 run saw an empty
          # list right after); wait up to 60 s, and also read the AppUserModelID stored in the shortcut itself.
          $lnk=Join-Path ([Environment]::GetFolderPath('Programs')) 'NeuroQuiz.lnk'; $lnkId=''
          for($i=0;$i -lt 30;$i++){ $start=@(Get-StartApps | Where-Object { $_.Name -eq 'NeuroQuiz' }); if(@($start | Where-Object AppID -eq 'org.neuroquiz.desktop').Count){break}; Start-Sleep -Seconds 2 }
          if(Test-Path -LiteralPath $lnk){ try{ $lnkId=(New-Object -ComObject Shell.Application).Namespace((Split-Path $lnk)).ParseName('NeuroQuiz.lnk').ExtendedProperty('System.AppUserModel.ID') } catch { $lnkId='read failed: '+$_.Exception.Message } }
          Check 'start-menu-appid' (@($start | Where-Object AppID -eq 'org.neuroquiz.desktop').Count -ge 1 -or $lnkId -eq 'org.neuroquiz.desktop') ("start apps: "+(($start | ForEach-Object { $_.AppID }) -join ',')+" after "+$i+" polls; shortcut "+(Test-Path -LiteralPath $lnk)+" AppID "+$lnkId)
          # 177 (packages F5): the upgraded app (QA copy) still has the learner data seeded with the previous release.
          & node.exe $seed check --runner $runnerDir --install $dir --state $state 2>&1 | ForEach-Object { Write-Output ("check "+$_) }
          $kept=$LASTEXITCODE
          Check 'learner-data-kept' ($kept -eq 0 -and -not (Test-Path -LiteralPath (Join-Path $dir 'NeuroQuiz-QA.exe'))) ("exit "+$kept)
          for($i=0;$i -lt 30 -and @(Get-Process -Name NeuroQuiz,NeuroQuiz-QA -ErrorAction SilentlyContinue).Count;$i++){ Start-Sleep -Seconds 1 }
          # 177 (packages F5): the shipped NeuroQuiz.exe itself refuses debugging switches (exit 1, nothing listening).
          foreach($switch in @('--remote-debugging-port=9222','--inspect=9229')){
            $port=[int]($switch -replace '^.*=','')
            $p=Start-Process -FilePath (Join-Path $dir 'NeuroQuiz.exe') -ArgumentList $switch -PassThru; $null=$p.Handle
            $exited=$p.WaitForExit(20000)
            $open=$false; try{ $tcp=New-Object Net.Sockets.TcpClient; $tcp.Connect('127.0.0.1',$port); $tcp.Close(); $open=$true } catch {}
            if(-not $exited){ Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2 }
            Check ('release-exe-refuses '+$switch) ($exited -and $p.ExitCode -eq 1 -and -not $open) ("exited "+$exited+"; exit "+$(if($exited){$p.ExitCode}else{'-'})+"; port open "+$open)
          }
          for($i=0;$i -lt 30 -and @(Get-Process -Name NeuroQuiz -ErrorAction SilentlyContinue).Count;$i++){ Start-Sleep -Seconds 1 }
          # 178 (audit-177 W03): the shipped NeuroQuiz.exe itself (no QA copy, no switches) starts, shows its window and stays up.
          $p=Start-Process -FilePath (Join-Path $dir 'NeuroQuiz.exe') -PassThru; $null=$p.Handle; $title=''
          for($i=0;$i -lt 45 -and -not $title;$i++){ Start-Sleep -Seconds 1; $p.Refresh(); if($p.HasExited){break}; $title=$p.MainWindowTitle }
          Start-Sleep -Seconds 10; $p.Refresh(); $alive=-not $p.HasExited; $procs=@(Get-Process -Name NeuroQuiz -ErrorAction SilentlyContinue).Count
          Check 'release-exe-normal-launch' ($alive -and $title -like 'NeuroQuiz*') ("window title '"+$title+"' after "+$i+" s; alive "+$alive+"; NeuroQuiz processes "+$procs)
          if($alive){ $null=$p.CloseMainWindow(); if(-not $p.WaitForExit(15000)){ Stop-Process -Name NeuroQuiz -Force -ErrorAction SilentlyContinue } }
          for($i=0;$i -lt 30 -and @(Get-Process -Name NeuroQuiz -ErrorAction SilentlyContinue).Count;$i++){ Start-Sleep -Seconds 1 }
          $marker=[IO.File]::ReadAllBytes((Join-Path $dir '.neuroquiz-owner'))
          $p=Start-Process -FilePath (Join-Path $dir 'Uninstall NeuroQuiz.exe') -ArgumentList '/S' -PassThru -Wait
          Start-Sleep -Seconds 5
          Check 'uninstall-clean' ((-not (Test-Path -LiteralPath $dir)) -and (-not (Test-Path -LiteralPath $key))) ("exit "+$p.ExitCode)
          # 178 (audit-177 W02): interrupted-setup recovery on the exact installer. Every case starts from a known state.
          $stage="$dir.__stage"; $backup="$dir.__previous"; $lnk=Join-Path ([Environment]::GetFolderPath('Programs')) 'NeuroQuiz.lnk'; $desk=Join-Path ([Environment]::GetFolderPath('Desktop')) 'NeuroQuiz.lnk'
          function Run-Setup(){ $q=Start-Process -FilePath $cur.exe -ArgumentList '/S' -PassThru -Wait; return $q.ExitCode }
          function Files([string]$d){ if(Test-Path -LiteralPath $d){ @(Get-ChildItem -LiteralPath $d -Recurse -File -Force).Count } else { -1 } }
          function Payload-Exact(){ $n=0; foreach($f in Get-ChildItem -LiteralPath $dir -Recurse -File -Force){ $rel=$f.FullName.Substring($dir.Length+1).ToLowerInvariant(); if($rel -eq 'uninstall neuroquiz.exe' -or $rel -eq '.neuroquiz-owner'){continue}; if(-not $expected.ContainsKey($rel) -or $f.Length -ne $expected[$rel].bytes){ return $false }; $n++ }; return ($n -eq $expected.Count) }
          # R1: a leftover stage that also holds a file the learner saved there: the installer removes only its own files,
          # keeps the folder and the learner's file, stops, and installs nothing.
          New-Item -ItemType Directory -Path (Join-Path $stage 'resources') | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $stage '.neuroquiz-owner'),$marker); Set-Content -LiteralPath (Join-Path $stage 'LICENSE') -Value 'partial'
          Set-Content -LiteralPath (Join-Path $stage 'my-notes.txt') -Value 'learner file'; Set-Content -LiteralPath (Join-Path $stage 'resources\keep-me.txt') -Value 'learner file 2'
          $code=Run-Setup
          Check 'recovery-stage-with-other-files-kept' ($code -eq 2 -and (Test-Path -LiteralPath (Join-Path $stage 'my-notes.txt')) -and (Test-Path -LiteralPath (Join-Path $stage 'resources\keep-me.txt')) -and -not (Test-Path -LiteralPath (Join-Path $stage 'LICENSE')) -and -not (Test-Path -LiteralPath $dir) -and -not (Test-Path -LiteralPath $key)) ("exit "+$code+"; stage files "+(Files $stage)+"; installed "+(Test-Path -LiteralPath $dir))
          Remove-Item -LiteralPath $stage -Recurse -Force
          # R6: a leftover stage in which a program sub-folder is a junction to a folder elsewhere: nothing behind the
          # junction is touched, nothing is installed.
          $outside=Join-Path $root 'outside-target'; New-Item -ItemType Directory -Path $outside | Out-Null; Set-Content -LiteralPath (Join-Path $outside 'en-US.pak') -Value 'sentinel outside the program folder'
          New-Item -ItemType Directory -Path $stage | Out-Null; [IO.File]::WriteAllBytes((Join-Path $stage '.neuroquiz-owner'),$marker)
          & cmd.exe /c mklink /J (Join-Path $stage 'locales') $outside | Out-Null
          $code=Run-Setup
          Check 'recovery-junction-not-followed' ($code -ne 0 -and (Get-Content -LiteralPath (Join-Path $outside 'en-US.pak') -Raw).Trim() -eq 'sentinel outside the program folder' -and (Test-Path -LiteralPath (Join-Path $stage 'locales')) -and -not (Test-Path -LiteralPath $dir) -and -not (Test-Path -LiteralPath $key)) ("exit "+$code+"; sentinel present "+(Test-Path -LiteralPath (Join-Path $outside 'en-US.pak'))+"; installed "+(Test-Path -LiteralPath $dir))
          & cmd.exe /c rmdir (Join-Path $stage 'locales') | Out-Null; Remove-Item -LiteralPath $stage -Recurse -Force
          # R2: a leftover stage holding only the installer's own files is cleared and the installation completes.
          New-Item -ItemType Directory -Path (Join-Path $stage 'locales') | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $stage '.neuroquiz-owner'),$marker); Set-Content -LiteralPath (Join-Path $stage 'LICENSE') -Value 'partial'; Set-Content -LiteralPath (Join-Path $stage 'locales\en-US.pak') -Value 'partial'
          $code=Run-Setup
          Check 'recovery-own-stage-cleared' ($code -eq 0 -and (Payload-Exact) -and -not (Test-Path -LiteralPath $stage) -and (Get-ItemProperty -LiteralPath $key).DisplayVersion -like ('*'+$target.release+'*')) ("exit "+$code+"; stage present "+(Test-Path -LiteralPath $stage)+"; files "+(Files $dir))
          # R3: an update that stopped between its two renames: the complete previous folder is put back and the update finishes.
          Rename-Item -LiteralPath $dir -NewName (Split-Path $backup -Leaf)
          $code=Run-Setup
          Check 'recovery-complete-backup-restored' ($code -eq 0 -and (Payload-Exact) -and -not (Test-Path -LiteralPath $backup)) ("exit "+$code+"; backup present "+(Test-Path -LiteralPath $backup)+"; files "+(Files $dir))
          # R4: the same, but the backup has lost a program file: it is not put back; it is kept exactly as it is.
          Rename-Item -LiteralPath $dir -NewName (Split-Path $backup -Leaf); Remove-Item -LiteralPath (Join-Path $backup 'LICENSE') -Force; $n4=Files $backup
          $code=Run-Setup
          Check 'recovery-incomplete-backup-kept' ($code -eq 2 -and -not (Test-Path -LiteralPath $dir) -and (Files $backup) -eq $n4 -and (Get-ItemProperty -LiteralPath $key).DisplayVersion -like ('*'+$target.release+'*')) ("exit "+$code+"; backup files "+(Files $backup)+" of "+$n4+"; installed "+(Test-Path -LiteralPath $dir))
          # The learner follows the message: delete the folder, run the installer again.
          Remove-Item -LiteralPath $backup -Recurse -Force
          $code=Run-Setup
          Check 'recovery-reinstall-after-delete' ($code -eq 0 -and (Payload-Exact)) ("exit "+$code+"; files "+(Files $dir))
          # R5: a newer NeuroQuiz is registered: the installer refuses before touching a leftover stage.
          $verNow=(Get-ItemProperty -LiteralPath $key).DisplayVersion; Set-ItemProperty -LiteralPath $key -Name DisplayVersion -Value '1.0.999'
          New-Item -ItemType Directory -Path $stage | Out-Null; [IO.File]::WriteAllBytes((Join-Path $stage '.neuroquiz-owner'),$marker); Set-Content -LiteralPath (Join-Path $stage 'LICENSE') -Value 'partial'; $n5=Files $stage; $d5=Files $dir
          $code=Run-Setup
          Check 'recovery-newer-version-nothing-moved' ($code -eq 2 -and (Files $stage) -eq $n5 -and (Test-Path -LiteralPath (Join-Path $stage 'LICENSE')) -and (Files $dir) -eq $d5) ("exit "+$code+"; stage files "+(Files $stage)+" of "+$n5+"; program files "+(Files $dir)+" of "+$d5)
          Set-ItemProperty -LiteralPath $key -Name DisplayVersion -Value $verNow; Remove-Item -LiteralPath $stage -Recurse -Force
          $p=Start-Process -FilePath (Join-Path $dir 'Uninstall NeuroQuiz.exe') -ArgumentList '/S' -PassThru -Wait
          Start-Sleep -Seconds 5
          Check 'uninstall-clean-after-recovery' ((-not (Test-Path -LiteralPath $dir)) -and (-not (Test-Path -LiteralPath $key)) -and -not (Test-Path -LiteralPath $lnk)) ("exit "+$p.ExitCode)
          $results | ConvertTo-Json -Depth 4
          if(@($results.Values | Where-Object { -not $_.pass }).Count){ exit 1 }
# Ordinary logs retain bounded, SHA-checked synthetic evidence. No upload/cache
# storage is created. A green functional job never closes the213 attended gates.
